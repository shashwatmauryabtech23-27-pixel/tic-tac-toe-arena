<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Process Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e27;
            color: #e0e0e0;
            overflow: hidden;
            font-size: 16px;
            min-height: 100vh;
        }

        #container {
            display: flex;
            height: 100vh;
        }

        /* Login Screen */
        #loginScreen {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0e27 0%, #16213e 100%);
            position: relative;
            overflow: hidden;
        }

        #loginScreen::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(100, 200, 255, 0.05);
            border-radius: 50%;
            top: -100px;
            left: -100px;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(20px); }
        }

        .loginBox {
            background: #1a1f3a;
            padding: 50px;
            border-radius: 20px;
            width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 10;
            backdrop-filter: blur(10px);
            animation: slideUp 0.6s ease-out;
            border: 1px solid rgba(100, 200, 255, 0.2);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loginBox h2 {
            color: #64c8ff;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 700;
            text-align: center;
        }

        .loginBox input {
            width: 100%;
            padding: 14px;
            background-color: #0f1629;
            border: 2px solid #3a4a6a;
            border-radius: 10px;
            color: #e0e0e0;
            font-family: inherit;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            font-size: 16px;
        }

        .loginBox input:focus {
            outline: none;
            border-color: #64c8ff;
            background-color: #1a2544;
            box-shadow: 0 0 0 3px rgba(100, 200, 255, 0.1);
        }

        .loginBox input::placeholder {
            color: #6a7a9a;
        }

        .loginBox button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #64c8ff 0%, #4a9fd8 100%);
            border: none;
            border-radius: 10px;
            color: #0a0e27;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(100, 200, 255, 0.4);
        }

        .loginBox button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(100, 200, 255, 0.6);
        }

        .loginBox button:active {
            transform: translateY(0);
        }

        .loginBox p {
            color: #6a7a9a;
            font-size: 13px;
            margin-top: 20px;
            text-align: center;
        }

        /* Sidebar */
        #sidebar {
            width: 280px;
            background: #0f1629;
            border-right: 1px solid #3a4a6a;
            padding: 25px;
            display: none;
            flex-direction: column;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        }

        #sidebar.active {
            display: flex;
        }

        .sidebarHeader {
            color: #64c8ff;
            margin-bottom: 25px;
            font-size: 14px;
            font-weight: 600;
            border-bottom: 1px solid #3a4a6a;
            padding-bottom: 15px;
        }

        .sidebarSection {
            margin-bottom: 25px;
        }

        .sectionTitle {
            color: #64c8ff;
            font-size: 12px;
            margin-bottom: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .playerList, .leaderboardList {
            font-size: 13px;
            line-height: 1.8;
        }

        .playerItem {
            color: #e0e0e0;
            padding: 8px 0;
            display: flex;
            align-items: center;
        }

        .playerItem::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            margin-right: 8px;
        }

        .playerItem.inGame {
            color: #fbbf24;
        }

        .playerItem.inGame::before {
            background: #fbbf24;
        }

        .leaderboardItem {
            display: flex;
            justify-content: space-between;
            color: #a0a0b0;
            padding: 8px 0;
            border-bottom: 1px solid #3a4a6a;
        }

        .leaderboardItem:last-child {
            border-bottom: none;
        }

        .btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, #64c8ff 0%, #4a9fd8 100%);
            border: none;
            border-radius: 10px;
            color: #0a0e27;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            margin-top: 15px;
            width: 100%;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(100, 200, 255, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(100, 200, 255, 0.5);
        }

        .btn:disabled {
            background: #3a4a6a;
            color: #6a7a9a;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* Main Area */
        #mainArea {
            flex: 1;
            padding: 40px;
            display: none;
            flex-direction: column;
            background: linear-gradient(to bottom, rgba(100, 200, 255, 0.02), rgba(100, 200, 255, 0.01));
        }

        #mainArea.active {
            display: flex;
        }

        .mainHeader {
            color: #64c8ff;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 700;
            border: 1px solid #3a4a6a;
            box-shadow: 0 5px 20px rgba(100, 200, 255, 0.1);
        }

        /* Lobby View */
        #lobbyView {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        .lobbyMessage {
            color: #a0a0b0;
            font-size: 18px;
            margin-bottom: 40px;
            font-weight: 500;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .actionButtons {
            display: flex;
            gap: 25px;
        }

        .actionBtn {
            padding: 16px 40px;
            background: linear-gradient(135deg, #64c8ff 0%, #4a9fd8 100%);
            border: none;
            border-radius: 12px;
            color: #0a0e27;
            cursor: pointer;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(100, 200, 255, 0.2);
        }

        .actionBtn:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 40px rgba(100, 200, 255, 0.3);
        }

        .actionBtn:active {
            transform: translateY(-2px);
        }

        /* Game Board */
        #gameView {
            display: none;
            flex-direction: column;
            align-items: center;
            flex: 1;
            justify-content: center;
        }

        #gameView.active {
            display: flex;
        }

        .gameInfo {
            margin-bottom: 30px;
            text-align: center;
            color: #e0e0e0;
            font-size: 16px;
            background: rgba(58, 74, 106, 0.3);
            padding: 20px 30px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid #3a4a6a;
        }

        .gameInfo div {
            margin: 5px 0;
        }

        .gameInfo .vs {
            color: #fbbf24;
            margin: 0 10px;
            font-weight: 700;
            font-size: 18px;
        }

        .turnIndicator {
            color: #64c8ff;
            margin-bottom: 30px;
            font-size: 18px;
            font-weight: 600;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 120px);
            grid-template-rows: repeat(3, 120px);
            gap: 10px;
            background: transparent;
            padding: 0;
            margin-bottom: 30px;
        }

        .cell {
            background: linear-gradient(135deg, #1a2544 0%, #0f1629 100%);
            border: 2px solid #3a4a6a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 54px;
            cursor: pointer;
            color: #64c8ff;
            font-weight: bold;
            border-radius: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(100, 200, 255, 0.1);
        }

        .cell:hover:not(.filled) {
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(100, 200, 255, 0.2);
            background: linear-gradient(135deg, #2a3554 0%, #1a2544 100%);
            border-color: #64c8ff;
        }

        .cell.filled {
            cursor: not-allowed;
        }

        .cell.O {
            color: #ff6b6b;
        }

        /* Status Messages */
        .statusMessage {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            background: #1a2544;
            border-radius: 10px;
            color: #64c8ff;
            font-size: 14px;
            z-index: 1000;
            display: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            font-weight: 600;
            animation: slideDown 0.4s ease-out;
            border: 1px solid #3a4a6a;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .statusMessage.show {
            display: block;
        }

        .statusMessage.error {
            background: #1a2544;
            color: #ff6b6b;
            border-color: #ff6b6b;
        }

        /* Chat */
        #chatBox {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 320px;
            height: 300px;
            background: #0f1629;
            border: 1px solid #3a4a6a;
            display: none;
            flex-direction: column;
            border-radius: 15px 15px 0 0;
            box-shadow: 0 -5px 30px rgba(0, 0, 0, 0.5);
            z-index: 800;
        }

        #chatBox.active {
            display: flex;
        }

        .chatHeader {
            padding: 16px;
            background: linear-gradient(135deg, #64c8ff 0%, #4a9fd8 100%);
            color: #0a0e27;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
            border-radius: 15px 15px 0 0;
        }

        .chatMessages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            font-size: 13px;
        }

        .chatMessage {
            margin-bottom: 10px;
            color: #a0a0b0;
        }

        .chatMessage .username {
            color: #64c8ff;
            font-weight: 700;
        }

        .chatInput {
            display: flex;
            border-top: 1px solid #3a4a6a;
            gap: 0;
        }

        .chatInput input {
            flex: 1;
            padding: 10px;
            background-color: #0a0e27;
            border: none;
            color: #e0e0e0;
            font-family: inherit;
            font-size: 13px;
        }

        .chatInput input:focus {
            outline: none;
        }

        .chatInput button {
            padding: 10px 15px;
            background-color: #64c8ff;
            border: none;
            color: #0a0e27;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.3s;
        }

        .chatInput button:hover {
            background-color: #4a9fd8;
        }

        /* Result Modal */
        .resultModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(5px);
        }

        .resultModal.show {
            display: flex;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .resultContent {
            background: #1a2544;
            padding: 50px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: scaleUp 0.4s ease-out;
            border: 1px solid #3a4a6a;
        }

        @keyframes scaleUp {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .resultContent h2 {
            font-size: 32px;
            margin-bottom: 20px;
            color: #64c8ff;
        }

        .resultContent.loss h2 {
            color: #ff6b6b;
        }

        .resultContent button {
            margin: 10px 5px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #64c8ff 0%, #4a9fd8 100%);
            border: none;
            border-radius: 10px;
            color: #0a0e27;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(100, 200, 255, 0.3);
        }

        .resultContent button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(100, 200, 255, 0.5);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f1629;
        }

        ::-webkit-scrollbar-thumb {
            background: #64c8ff;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4a9fd8;
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen">
        <div class="loginBox">
            <h2>SYSTEM LOGIN REQUIRED</h2>
            <input type="text" id="usernameInput" placeholder="Enter username..." maxlength="15" autocomplete="off">
            <button onclick="login()">CONNECT</button>
            <p style="color: #888; font-size: 10px; margin-top: 15px;">Enter any username to join the network</p>
        </div>
    </div>

    <!-- Main Container -->
    <div id="container" style="display: none;">
        <!-- Sidebar -->
        <div id="sidebar">
            <div class="sidebarHeader">
                <div>USER: <span id="currentUser"></span></div>
                <div style="margin-top: 5px;">STATUS: CONNECTED</div>
            </div>

            <div class="sidebarSection">
                <div class="sectionTitle">ACTIVE USERS (<span id="playerCount">0</span>)</div>
                <div class="playerList" id="playerList"></div>
            </div>

            <div class="sidebarSection">
                <div class="sectionTitle">LEADERBOARD</div>
                <div class="leaderboardList" id="leaderboardList"></div>
            </div>

            <div class="sidebarSection" style="margin-top: auto;">
                <button class="btn" onclick="toggleChat()">TOGGLE CHAT</button>
            </div>
        </div>

        <!-- Main Area -->
        <div id="mainArea">
            <div class="mainHeader">
                <span>SYSTEM PROCESS MANAGER v2.1</span>
            </div>

            <!-- Lobby View -->
            <div id="lobbyView">
                <div class="lobbyMessage" id="lobbyMessage">Ready to play</div>
                <div class="actionButtons">
                    <button class="actionBtn" onclick="findMatch()">QUICK MATCH</button>
                    <button class="actionBtn" onclick="startTournament()">START TOURNAMENT</button>
                </div>
            </div>

            <!-- Game View -->
            <div id="gameView">
                <div class="gameInfo">
                    <div><span id="player1Name"></span> (X) <span class="vs">VS</span> <span id="player2Name"></span> (O)</div>
                    <div>YOUR SYMBOL: <span id="yourSymbol"></span></div>
                </div>
                <div class="turnIndicator" id="turnIndicator">Waiting...</div>
                <div class="board" id="board">
                    <div class="cell" data-index="0" onclick="makeMove(0)"></div>
                    <div class="cell" data-index="1" onclick="makeMove(1)"></div>
                    <div class="cell" data-index="2" onclick="makeMove(2)"></div>
                    <div class="cell" data-index="3" onclick="makeMove(3)"></div>
                    <div class="cell" data-index="4" onclick="makeMove(4)"></div>
                    <div class="cell" data-index="5" onclick="makeMove(5)"></div>
                    <div class="cell" data-index="6" onclick="makeMove(6)"></div>
                    <div class="cell" data-index="7" onclick="makeMove(7)"></div>
                    <div class="cell" data-index="8" onclick="makeMove(8)"></div>
                </div>
                <button class="btn" onclick="returnToLobby()" style="width: 200px;">RETURN TO LOBBY</button>
            </div>
        </div>
    </div>

    <!-- Chat Box -->
    <div id="chatBox">
        <div class="chatHeader" onclick="toggleChat()">CHAT [CLICK TO TOGGLE]</div>
        <div class="chatMessages" id="chatMessages"></div>
        <div class="chatInput">
            <input type="text" id="chatInput" placeholder="Type message..." maxlength="100">
            <button onclick="sendChat()">SEND</button>
        </div>
    </div>

    <!-- Status Message -->
    <div class="statusMessage" id="statusMessage"></div>

    <!-- Result Modal -->
    <div class="resultModal" id="resultModal">
        <div class="resultContent" id="resultContent">
            <h2 id="resultText">YOU WIN!</h2>
            <button onclick="closeResult()">BACK TO LOBBY</button>
            <button onclick="requestRematch()">REMATCH</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        let socket;
        let currentUsername;
        let currentGameId;
        let yourSymbol;
        let yourTurn = false;

        function login() {
            const username = document.getElementById('usernameInput').value.trim();
            if (!username) {
                showStatus('Please enter a username', 'error');
                return;
            }

            socket = io();
            
            socket.emit('join', username);

            socket.on('joined', (data) => {
                currentUsername = data.username;
                document.getElementById('currentUser').textContent = currentUsername;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('container').style.display = 'flex';
                document.getElementById('sidebar').classList.add('active');
                document.getElementById('mainArea').classList.add('active');
                showStatus('Connected to network');
            });

            socket.on('error', (msg) => {
                showStatus(msg, 'error');
            });

            socket.on('lobbyUpdate', (data) => {
                updatePlayerList(data.players);
                updateLeaderboard(data.leaderboard);
            });

            socket.on('waiting', (msg) => {
                document.getElementById('lobbyMessage').textContent = msg;
            });

            socket.on('searchCancelled', () => {
                document.getElementById('lobbyMessage').textContent = 'Ready to play';
            });

            socket.on('gameStart', (data) => {
                currentGameId = data.gameId;
                yourSymbol = data.symbol;
                yourTurn = data.yourTurn;
                
                document.getElementById('lobbyView').style.display = 'none';
                document.getElementById('gameView').classList.add('active');
                document.getElementById('yourSymbol').textContent = yourSymbol;
                
                showStatus(`Game started! You are ${yourSymbol}`);
                resetBoard();
            });

            socket.on('gameUpdate', (state) => {
                updateBoard(state);
            });

            socket.on('gameEnd', (data) => {
                setTimeout(() => {
                    showResult(data.result);
                }, 500);
            });

            socket.on('opponentDisconnected', () => {
                showStatus('Opponent disconnected', 'error');
                returnToLobby();
            });

            socket.on('rematchRequest', (requesterId) => {
                if (confirm('Opponent wants a rematch. Accept?')) {
                    socket.emit('acceptRematch', requesterId);
                }
            });

            socket.on('chatMessage', (data) => {
                addChatMessage(data.username, data.message);
            });

            socket.on('tournamentStart', (data) => {
                showStatus('Tournament started!');
            });
        }

        function findMatch() {
            socket.emit('findMatch');
        }

        function startTournament() {
            socket.emit('startTournament');
        }

        function makeMove(position) {
            if (!yourTurn) return;
            
            const cell = document.querySelector(`[data-index="${position}"]`);
            if (cell.classList.contains('filled')) return;

            socket.emit('makeMove', {
                gameId: currentGameId,
                position: position
            });
        }

        function updateBoard(state) {
            document.getElementById('player1Name').textContent = state.player1Name;
            document.getElementById('player2Name').textContent = state.player2Name;

            state.board.forEach((symbol, index) => {
                const cell = document.querySelector(`[data-index="${index}"]`);
                if (symbol) {
                    cell.textContent = symbol;
                    cell.classList.add('filled', symbol);
                }
            });

            yourTurn = state.currentTurn === socket.id;
            document.getElementById('turnIndicator').textContent = yourTurn ? 'YOUR TURN' : 'OPPONENT\'S TURN';
            document.getElementById('turnIndicator').style.color = yourTurn ? '#00FF00' : '#FFD700';
        }

        function resetBoard() {
            document.querySelectorAll('.cell').forEach(cell => {
                cell.textContent = '';
                cell.classList.remove('filled', 'X', 'O');
            });
        }

        function showResult(result) {
            const modal = document.getElementById('resultModal');
            const content = document.getElementById('resultContent');
            const text = document.getElementById('resultText');
            
            content.classList.remove('loss');
            
            if (result === 'win') {
                text.textContent = 'YOU WIN!';
                text.style.color = '#00FF00';
            } else if (result === 'loss') {
                text.textContent = 'YOU LOSE';
                text.style.color = '#FF4444';
                content.classList.add('loss');
            } else {
                text.textContent = 'DRAW';
                text.style.color = '#FFD700';
            }
            
            modal.classList.add('show');
        }

        function closeResult() {
            document.getElementById('resultModal').classList.remove('show');
            returnToLobby();
        }

        function requestRematch() {
            socket.emit('rematch', currentGameId);
            document.getElementById('resultModal').classList.remove('show');
            showStatus('Rematch request sent...');
        }

        function returnToLobby() {
            document.getElementById('gameView').classList.remove('active');
            document.getElementById('lobbyView').style.display = 'flex';
            resetBoard();
            currentGameId = null;
            yourTurn = false;
        }

        function updatePlayerList(players) {
            const list = document.getElementById('playerList');
            document.getElementById('playerCount').textContent = players.length;
            
            list.innerHTML = players.map(p => 
                `<div class="playerItem ${p.inGame ? 'inGame' : ''}">> ${p.username} ${p.inGame ? '[IN GAME]' : ''}</div>`
            ).join('');
        }

        function updateLeaderboard(leaderboard) {
            const list = document.getElementById('leaderboardList');
            
            list.innerHTML = leaderboard.map((p, i) => 
                `<div class="leaderboardItem">
                    <span>${i + 1}. ${p.username}</span>
                    <span>${p.points}pts</span>
                </div>`
            ).join('');
        }

        function toggleChat() {
            document.getElementById('chatBox').classList.toggle('active');
        }

        function sendChat() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (message) {
                socket.emit('chatMessage', message);
                input.value = '';
            }
        }

        function addChatMessage(username, message) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = 'chatMessage';
            div.innerHTML = `<span class="username">${username}:</span> ${message}`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function showStatus(message, type = 'normal') {
            const status = document.getElementById('statusMessage');
            status.textContent = message;
            status.className = 'statusMessage show';
            if (type === 'error') status.classList.add('error');
            
            setTimeout(() => {
                status.classList.remove('show');
            }, 3000);
        }

        // Enter key handlers
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('usernameInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') login();
            });

            document.getElementById('chatInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendChat();
            });
        });
    </script>
</body>
</html>
